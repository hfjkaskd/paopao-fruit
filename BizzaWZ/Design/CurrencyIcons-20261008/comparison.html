<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><title>货币图标地区对比</title>
<style>body{margin:0;background:#f1f4ef;color:#203a2b;font:16px system-ui}header{padding:24px 32px;background:white;position:sticky;top:0;box-shadow:0 1px 8px #0001}h1{font-size:24px;margin:0 0 8px}p{margin:8px 0;color:#5b6b60}select{font:inherit;padding:8px 16px;border:1px solid #aec2ae;border-radius:8px}main{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;padding:24px;max-width:1440px;margin:auto}article{background:white;border-radius:18px;padding:16px;text-align:center}h2{margin:5px 0 12px}.icons{display:flex;align-items:center;justify-content:center;gap:18px;height:130px;background:#fff9e9;border-radius:12px}.icons img{max-width:105px;max-height:105px;object-fit:contain}.screen{width:100%;margin-top:18px;border-radius:12px}@media(max-width:650px){main{grid-template-columns:1fr}}</style>
<header><h1>美国 / 巴西 / 印尼 · 货币图标</h1><p>钞票和金币统一采用框架原有素材。以下为预制体静态预览，金额为展示样例。</p><select id="page"><option value="SlotPanel">幸运转盘</option><option value="SlotFQAPanel">转盘说明</option><option value="GetRewardPanel">结算奖励</option><option value="ExchangeRatePanel">兑换倍率</option><option value="FakeWithdrawPanel">现金提现</option></select></header>
<main>
<article><h2>美国 · $</h2><div class="icons"><img alt="美元金币" src="../../Assets/BizzaWZ/Final/Real/GameAssets/WzTexture_Money/GoldCoin_US.png"><img alt="美元钞票" src="../../Assets/BizzaWZ/Final/Real/GameAssets/WzTexture_Money/StackMoney_US.png"></div><img class="screen" data-country="US" alt="美国预览" src="SlotPanel-US.png"></article>
<article><h2>巴西 · R$</h2><div class="icons"><img alt="雷亚尔金币" src="../../Assets/BizzaWZ/Final/Real/GameAssets/WzTexture_Money/GoldCoin_BR.png"><img alt="雷亚尔钞票" src="../../Assets/BizzaWZ/Final/Real/GameAssets/WzTexture_Money/StackMoney_BR.png"></div><img class="screen" data-country="BR" alt="巴西预览" src="SlotPanel-BR.png"></article>
<article><h2>印尼 · Rp</h2><div class="icons"><img alt="印尼盾金币" src="../../Assets/BizzaWZ/Final/Real/GameAssets/WzTexture_Money/GoldCoin_ID.png"><img alt="印尼盾钞票" src="../../Assets/BizzaWZ/Final/Real/GameAssets/WzTexture_Money/StackMoney_ID.png"></div><img class="screen" data-country="ID" alt="印尼预览" src="SlotPanel-ID.png"></article>
</main><script>document.getElementById('page').addEventListener('change',e=>document.querySelectorAll('.screen').forEach(img=>img.src=e.target.value+'-'+img.dataset.country+'.png'));</script></html>
